########################################
## Grouper Provisioning Target Custom UI
## New settings - tied to provisioners
########################################

# For provisioningTarget2 settings, each set of configs is tied to a provisioner config id. It needs a section defined, which will
# become the H1 header. for grouping. The label and description are optional, and are reasonable defaults if left out.

custom.provisioningTarget2.targetNames = invalid-name, eduPersonEntitlement, eduPersonAffiliation, groupOfNames

# Since there isn't a provisioner with this name, it will log an error to the console, and ignore in the UI
custom.provisioningTarget2.targets.invalid-name.label = Sync to Invalid Provisioner
custom.provisioningTarget2.targets.invalid-name.description = You should not be seeing this
custom.provisioningTarget2.targets.invalid-name.section = LDAP

# Set a friendly name, detailed description, and section for the LDAP provisioner
custom.provisioningTarget2.targets.eduPersonEntitlement.label = LDAP entitlements
custom.provisioningTarget2.targets.eduPersonEntitlement.description = Setting this to "yes" will push this group and its members to LDAP eduPersonEntitlement
custom.provisioningTarget2.targets.eduPersonEntitlement.section = LDAP Users

# Since there is no label or description, it will set reasonable defaults. Note it will be in the same section as eduPersonEntitlement
custom.provisioningTarget2.targets.eduPersonAffiliation.section = LDAP Users

# Note this is in its own section
custom.provisioningTarget2.targets.groupOfNames.label = Sync to LDAP groups
custom.provisioningTarget2.targets.groupOfNames.description = Setting this to "yes" will push this group and its members to the LDAP groups OU
custom.provisioningTarget2.targets.groupOfNames.section = LDAP Groups


########################################
## Grouper Provisioning Target Custom UI
## Legacy settings
########################################

# These are form field widgets that correspond to an attribute defined under etc:attribute:provisioningTargets.
# The property name corresponds to the attribute name (with colons replacing dashes). The attribute subfolder display
# names becomes the form H1 headings. Attribute names in the folders become form fields. Valid types for the attribute
# are 'yesNo', 'trueFalse', or 'select'. For the select type, the lov values become the options for the select list. If no
# type is defined, the result is a text field, where a default value can be set.


custom.provisioningTargetCandidate.attributeDefName = etc:attribute:provisioningTargets:provisioningCandidates

custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleFavoriteFood.type=select
custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleFavoriteFood.lov=pizza,ice cream, chocolate

custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleSwitchToO365.type=yesNo
custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleSwitchToO365.default=no

custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleIrishGetsTheTitle.type=trueFalse
custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleIrishGetsTheTitle.default=true

custom.provisioningTarget.etc-attribute-provisioningTargets-google-googleFirstName.default=John

custom.provisioningTarget.etc-attribute-provisioningTargets-ad-adOrgUnit.default=something
